name: Backfill Daily Commits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "rebornlokii"
          git config user.email "lydieakokpe431@gmail.com"

      - name: Create commits
        run: |
          for i in {7..1}; do
            DATE=$(date -d "$i days ago" '+%Y-%m-%dT12:00:00')
            
            echo "Daily activity: $DATE" > daily-activity.txt

            git add daily-activity.txt

            GIT_AUTHOR_DATE="$DATE" \
            GIT_COMMITTER_DATE="$DATE" \
            git commit -m "chore: daily activity $DATE"
          done

          git push
