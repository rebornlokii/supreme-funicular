name: Draw HELLO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Draw HELLO
        run: |
          START=$(date -u -d "70 days ago" +%s)

          # 7-row letters, each column is one week.
          # 1 = commit, 0 = empty.
          #
          # H E L L O
          #
          # █   █ █████ █     █      ███
          # █   █ █     █     █     █   █
          # █████ ████  █     █     █   █
          # █   █ █     █     █     █   █
          # █   █ █████ █████ █████  ███

          pixels=(
            "10001" "10001" "11111" "10001" "10001"
          )

          # Generate a visible HELLO pattern using commit dates.
          # GitHub contribution cells are aligned by weekday.
          for week in {0..29}; do
            for day in {0..6}; do

              # HELLO occupies the middle 5 rows.
              row=$day

              commit=0

              case "$row" in
                1|2|3|4|5)
                  case "$week" in
                    1|2|3|5|6|7|9|10|11|13|14|16|17|18|20|21|22|23|24|25|26)
                      commit=1
                      ;;
                  esac
                  ;;
              esac

              if [ "$commit" = "1" ]; then
                DATE=$(date -u -d "@$((START + (week * 7 + day) * 86400))" +%Y-%m-%d)

                echo "$DATE" > hello.txt
                git add hello.txt

                GIT_AUTHOR_DATE="${DATE}T12:00:00Z" \
                GIT_COMMITTER_DATE="${DATE}T12:00:00Z" \
                git commit -m "hello 👋 $DATE"
              fi
            done
          done

          git push
